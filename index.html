<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <meta name="description" content="A little hello from the web.">
  <title>Hello, world!</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20231f;background:#f6f3ed;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}
    body{min-width:320px;min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;background-image:radial-gradient(#d9d4c9 .7px,transparent .7px);background-size:19px 19px}
    main{width:min(100%,680px);min-height:430px;padding:clamp(32px,7vw,72px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:#fffefa;border:1px solid #e8e4db;border-radius:8px;box-shadow:0 22px 70px #37322612}
    .eyebrow,.signature{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
    .eyebrow{display:flex;align-items:center;gap:10px;color:#73766b}
    .dot{width:8px;height:8px;border-radius:50%;background:#91a66f;box-shadow:0 0 0 4px #91a66f20}
    h1{margin:30px 0 14px;font-size:clamp(64px,12vw,112px);line-height:.98;letter-spacing:-.085em;font-weight:700}
    h1 span{color:#718454}
    p{margin:12px 0 48px;color:#77776f;font-size:clamp(15px,2.5vw,18px)}
    .signature{color:#9a988f}.signature span{color:#718454;font-size:16px;margin-left:4px}
    @media(max-width:480px){main{min-height:370px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot"></span>A small start</div>
    <h1>Hello,<br><span>world!</span></h1>
    <p>Every great idea begins with a first line.</p>
    <div class="signature">Made for the web <span aria-hidden="true">↗</span></div>
  </main>
</body>
</html>
